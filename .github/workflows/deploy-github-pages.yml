# Build static export (Next.js) and deploy to GitHub Pages.
#
# Setup in the repo: Settings → Pages → Build and deployment → Source: GitHub Actions.
#
# URL e base path:
# - Predefinito: se il repo si chiama <owner>.github.io → sito utente alla radice;
#   altrimenti progetto su https://<owner>.github.io/<nome-repo>/ (base path = /<nome-repo>).
# - Dominio personalizzato (es. www.studiocapoferri.eu): imposta la variabile di repository
#   NEXT_PUBLIC_SITE_URL al dominio pubblico (es. https://www.studiocapoferri.eu).
#   Opzionale: NEXT_PUBLIC_BASE_PATH (vuoto per radice sul dominio; per GitHub project pages di solito /nome-repo).

name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure public URL and base path
        run: |
          set -e
          SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          BASE_PATH_VAR="${{ vars.NEXT_PUBLIC_BASE_PATH }}"
          REPO="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"

          if [ -n "$SITE_URL" ]; then
            echo "NEXT_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"
            if [ -n "$BASE_PATH_VAR" ]; then
              echo "NEXT_PUBLIC_BASE_PATH=$BASE_PATH_VAR" >> "$GITHUB_ENV"
            else
              echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
            fi
          elif [ -f "CNAME" ]; then
            DOMAIN=$(head -1 CNAME | tr -d '[:space:]')
            echo "NEXT_PUBLIC_SITE_URL=https://$DOMAIN" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          elif [ "$REPO" = "$OWNER.github.io" ]; then
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=" >> "$GITHUB_ENV"
          else
            echo "NEXT_PUBLIC_SITE_URL=https://$OWNER.github.io/$REPO" >> "$GITHUB_ENV"
            echo "NEXT_PUBLIC_BASE_PATH=/$REPO" >> "$GITHUB_ENV"
          fi
          echo "STATIC_EXPORT=1" >> "$GITHUB_ENV"

      - name: Build static export
        run: npm run build:static

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
